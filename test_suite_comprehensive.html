<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comprehensive Suite</title>
  <link rel="stylesheet" href="css/prolingo.css">
</head>
<body class="theme-dark">
  <div id="test-results">Testing...</div>

  <!-- Standard DOM from index.html -->
  <div id="app-sidebar">
    <span class="logo-owl" data-icon="owl"></span>
    <span class="nav-tab-icon" data-icon="learn"></span>
    <span class="nav-tab-icon" data-icon="leagues"></span>
    <span class="nav-tab-icon" data-icon="quests"></span>
    <span class="nav-tab-icon" data-icon="shop"></span>
    <span class="nav-tab-icon" data-icon="profile"></span>
    <span class="nav-tab-icon" data-icon="practice"></span>
    <span class="nav-tab-icon" data-icon="settings"></span>
  </div>
  <button id="btn-course-selector"><span class="course-flag" data-icon="python"></span></button>
  <div id="stat-streak-badge"><span class="stat-icon-wrap" data-icon="fire"></span><span id="header-streak-val">0</span></div>
  <div id="stat-gems-badge"><span class="stat-icon-wrap" data-icon="gem"></span><span id="header-gems-val">50</span></div>
  <div id="stat-hearts-badge"><span class="stat-icon-wrap" data-icon="heart"></span><span id="header-hearts-val">5</span></div>

  <div id="view-lesson" class="hidden">
    <div class="lesson-top-bar">
      <button id="btn-lesson-exit" class="btn-close-lesson" title="Quit Lesson">✕</button>
      <div class="lesson-progress-bar-track">
        <div id="lesson-progress-fill" class="lesson-progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="lesson-hearts-bar" class="lesson-hearts-bar"></div>
    </div>
    <div class="lesson-question-wrapper" id="lesson-question-container"></div>
    <div id="lesson-bottom-sheet" class="bottom-sheet state-idle">
      <div id="sheet-feedback-info" class="sheet-info-col"></div>
      <button id="lesson-check-btn" class="btn-3d btn-sheet disabled" disabled onclick="LessonRunner.handleCheckButtonClick()">CHECK</button>
    </div>
  </div>

  <div id="hearts-refill-modal" class="modal-overlay hidden"></div>
  <div id="lesson-quit-modal" class="modal-overlay hidden">
    <button class="btn-primary" onclick="LessonRunner.hideQuitModal()">Keep Learning</button>
    <button class="btn-sheet" onclick="LessonRunner.close()">Quit Lesson</button>
  </div>
  
  <!-- Google Sign-In Modal DOM Mock -->
  <div id="google-signin-modal" class="modal-overlay hidden">
    <div id="google-saved-accounts-section" class="hidden">
      <div id="google-saved-accounts-list"></div>
    </div>
    <form id="google-auth-form">
      <input type="email" id="google-input-email">
      <input type="text" id="google-input-name">
      <div id="google-avatar-preview"></div>
    </form>
  </div>

  <div id="app-toast" class="app-toast hidden"></div>
  <div id="main-content-view">
    <div id="view-learn" class="view-panel">
      <div id="learn-path-container"></div>
    </div>
    <div id="view-practice" class="view-panel hidden">
      <div id="practice-container"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/state.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/app.js"></script>

  <script>
    const errors = [];
    window.onerror = function(msg, url, line, col, err) {
      errors.push('WINDOW_ERROR: ' + msg + ' at ' + line + ':' + col);
    };
    window.onunhandledrejection = function(e) {
      errors.push('UNHANDLED_REJECTION: ' + (e.reason ? e.reason.message : e));
    };

    window.addEventListener('DOMContentLoaded', () => {
      const logs = [];
      const assert = (cond, msg) => {
        if (!cond) throw new Error('ASSERT FAILED: ' + msg);
        logs.push('PASS: ' + msg);
      };

      try {
        // Init state & app
        ProLingoState.init();
        App.init();

        // Check LessonRunner.init
        LessonRunner.init();

        // 1. Test exit button binding & quit modal
        const exitBtn = document.getElementById('btn-lesson-exit');
        assert(Boolean(exitBtn), 'btn-lesson-exit exists in DOM');
        assert(typeof LessonRunner.promptExit === 'function', 'LessonRunner.promptExit is a function');
        assert(typeof LessonRunner.close === 'function', 'LessonRunner.close is a function');
        assert(typeof LessonRunner.showQuitModal === 'function', 'LessonRunner.showQuitModal is a function');

        // Start a lesson to test exit button interaction
        const pyCourse = CURRICULUM.getCourse('python');
        const lesson1 = pyCourse.units[0].lessons[0];
        LessonRunner.start(lesson1);
        assert(!document.getElementById('view-lesson').classList.contains('hidden'), 'view-lesson is visible');

        // Click exit button
        exitBtn.click();
        const quitModal = document.getElementById('lesson-quit-modal');
        assert(!quitModal.classList.contains('hidden'), 'Quit modal opened on exit button click');

        // Test Keep Learning button
        LessonRunner.hideQuitModal();
        assert(quitModal.classList.contains('hidden'), 'Quit modal hidden on Keep Learning');
        assert(!document.getElementById('view-lesson').classList.contains('hidden'), 'Lesson still active after Keep Learning');

        // 2. Test Heart Regeneration Ticker
        LessonRunner.currentLesson = { id: 'test' };
        App.tickHeartRegen(); // Must not throw
        logs.push('PASS: App.tickHeartRegen() executed without throwing');

        // 3. Test out-of-hearts flow
        ProLingoState.data.stats.hearts = 1;
        ProLingoState.save();
        LessonRunner.start(lesson1);

        // Answer wrong
        const q0 = LessonRunner.questions[0];
        LessonRunner.selectedAnswer = (q0.correctIndex === 0 ? 1 : 0);
        LessonRunner.checkAnswer(); // Incorrect
        assert(ProLingoState.data.stats.hearts === 0, 'Hearts dropped to 0');

        // Advance to trigger out of hearts modal
        LessonRunner.checkAnswer(); // calls nextQuestion() -> showOutOfHeartsModal()
        const refillModal = document.getElementById('hearts-refill-modal');
        assert(!refillModal.classList.contains('hidden'), 'Out of hearts modal is displayed');

        // 4. Test clicking Practice to Earn Hearts from modal
        const practiceBtn = refillModal.querySelector('.btn-secondary');
        assert(Boolean(practiceBtn), 'Practice button exists in hearts modal');
        practiceBtn.click();

        assert(refillModal.classList.contains('hidden'), 'Hearts modal closed on practice click');
        assert(LessonRunner.currentLesson !== null, 'Practice lesson is active');
        assert(LessonRunner.currentLesson.isPractice === true, 'LessonRunner is in practice mode');
        assert(LessonRunner.questions.length > 0, 'Practice lesson has questions');

        // 5. Answer all 3 practice questions
        for (let i = 0; i < 3; i++) {
          const q = LessonRunner.questions[LessonRunner.currentIndex];
          if (q.type === 'mcq' || q.type === 'output' || q.type === 'bug_hunter') {
            LessonRunner.selectedAnswer = q.correctIndex;
          } else if (q.type === 'fill_blank') {
            LessonRunner.selectedAnswer = q.correctValue;
          } else if (q.type === 'reorder') {
            LessonRunner.getReorderCurrentIndices = () => q.correctOrder;
          } else {
            LessonRunner.selectedAnswer = true;
          }
          LessonRunner.checkAnswer(); // Check
          LessonRunner.checkAnswer(); // Continue
        }

        assert(ProLingoState.data.stats.hearts >= 1, 'Hearts recovered to at least 1 after practice');

        // 6. Test Personal Google Sign-In with User-Entered Credentials
        const testEmail = 'developer.test@gmail.com';
        const testName = 'Dev Learner';
        document.getElementById('google-input-email').value = testEmail;
        document.getElementById('google-input-name').value = testName;
        App.submitGoogleSignIn();

        assert(ProLingoState.data.profile.email === testEmail, 'User email updated to entered Google account');
        assert(ProLingoState.data.profile.name === testName, 'User name updated to entered name');
        assert(ProLingoState.data.profile.isGoogle === true, 'Profile is marked as Google account');

        // Give this user 25 XP and check state
        ProLingoState.data.stats.xp = 25;
        ProLingoState.save();
        const user1Id = ProLingoState.activeUserId;

        // 7. Test Second Personal Account Creation (Isolation Verification)
        const testEmail2 = 'another.coder@gmail.com';
        const testName2 = 'Second Coder';
        document.getElementById('google-input-email').value = testEmail2;
        document.getElementById('google-input-name').value = testName2;
        App.submitGoogleSignIn();

        assert(ProLingoState.data.profile.email === testEmail2, 'Second user active with independent email');
        assert(ProLingoState.activeUserId !== user1Id, 'Second user has unique distinct ID');
        assert(ProLingoState.data.stats.xp === 0, 'New user starts with 0 XP (isolated state)');

        // 8. Test Dynamic Saved Accounts Rendering & Switching Back
        App.renderGoogleSavedAccounts();
        const savedList = document.getElementById('google-saved-accounts-list');
        assert(savedList.children.length >= 2, 'Saved accounts list displays multiple personal accounts');

        // Switch back to user 1
        App.loginWithPresetAccount(user1Id);
        assert(ProLingoState.activeUserId === user1Id, 'Switched back to user 1');
        assert(ProLingoState.data.stats.xp === 25, 'User 1 XP (25) preserved accurately without data collision');

        if (errors.length > 0) {
          throw new Error('ERRORS DETECTED: ' + errors.join('; '));
        }

        document.getElementById('test-results').innerHTML = '<h1 style="color:green">ALL_TESTS_PASSED</h1><pre>' + logs.join('\n') + '</pre>';
      } catch (err) {
        document.getElementById('test-results').innerHTML = '<h1 style="color:red">TEST_FAILED: ' + err.message + '</h1><pre>' + err.stack + '\n' + logs.join('\n') + '\n' + errors.join('\n') + '</pre>';
      }
    });
  </script>
</body>
</html>
